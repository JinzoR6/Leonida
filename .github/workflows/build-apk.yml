name: Build LEONIDA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: leonida-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Compile and verify debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out LEONIDA repository
        uses: actions/checkout@v4

      - name: Restore Android source project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q LEONIDA-v0.9.2-source.zip -d "$RUNNER_TEMP/leonida-source"
          cp -a "$RUNNER_TEMP/leonida-source/." "$GITHUB_WORKSPACE/"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript and finance calculations
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check finance.js
          node --check voice.js
          node --check route.js
          node tests/finance-smoke.test.cjs

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Android SDK: $ANDROID_HOME"
          "$SDKMANAGER" --version

      - name: Install Android 36 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android :app:assembleDebug

      - name: Verify APK signature and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee LEONIDA-debug-apk.sha256
          cp "$APK" LEONIDA-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LEONIDA-debug-APK-${{ github.run_number }}
          path: |
            LEONIDA-debug.apk
            LEONIDA-debug-apk.sha256
          if-no-files-found: error
          retention-days: 14
